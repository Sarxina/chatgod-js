name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    uses: Sarxina/sarxina-tools/.github/workflows/release.yml@main
    permissions:
      contents: write   # for pushing the tag
      id-token: write   # for npm provenance via OIDC
    with:
      npm_publish: true
      apt_packages: libasound2-dev   # speaker native module
      build_command: npm run build:server
      test_command: npm test
    secrets: inherit
