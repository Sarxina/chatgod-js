name: Test

# Runs the unit-test suite. The `publish.yml` workflow runs the same `npm
# test` step on push-to-main as a publish gate; this workflow exists so the
# same gate runs on pull requests, where it acts as a required status check
# (configured via branch protection).
on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install ALSA dev headers (for speaker native build)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
